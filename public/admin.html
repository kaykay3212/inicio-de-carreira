<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#0c090e" />
  <title>Painel | Agendamentos</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <header class="topo topo--rolado">
    <div class="container topo__conteudo">
      <a href="/" class="logo"><span class="logo__ponto"></span>Painel de Agendamentos</a>
      <a href="/" class="botao botao--pequeno botao--vidro">Ver site</a>
    </div>
  </header>

  <main class="container admin">
    <form id="login" class="cartao admin__login">
      <h2>Entrar</h2>
      <label>Senha do painel
        <input type="password" name="senha" autocomplete="current-password" required />
      </label>
      <p class="erro" id="erro-login" role="alert"></p>
      <button class="botao" type="submit">Entrar</button>
    </form>

    <section id="painel" hidden>
      <div class="admin__barra">
        <h2>Próximos horários</h2>
        <div style="display:flex;gap:.5rem;flex-wrap:wrap">
          <label style="flex-direction:row;align-items:center;gap:.4rem"><input type="checkbox" id="mostrar-cancelados" /> Mostrar cancelados</label>
          <button class="botao botao--pequeno botao--contorno" id="atualizar" type="button">Atualizar</button>
          <button class="botao botao--pequeno botao--contorno" id="sair" type="button">Sair</button>
        </div>
      </div>
      <div id="lista"></div>
    </section>
  </main>

  <script src="/js/admin.js"></script>
</body>
</html>
