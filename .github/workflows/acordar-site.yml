# Acorda o site Maya Souza Nails (Render grátis) de manhã, antes das 7h.
# Durante o dia (7h às 22h) o próprio site se mantém acordado.
# Horários em UTC: 09:40–10:20 UTC = 06:40–07:20 em Brasília.
# Várias execuções porque o GitHub pode atrasar tarefas agendadas.
name: Acordar o site

on:
  schedule:
    - cron: '40,50 9 * * *'
    - cron: '0,10,20 10 * * *'
  workflow_dispatch: {}

jobs:
  acordar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Visitar o site
        run: |
          for tentativa in 1 2 3; do
            codigo=$(curl -s -o /dev/null -w '%{http_code}' --max-time 90 https://maya-souza-nails.onrender.com/healthz || true)
            echo "Tentativa $tentativa: HTTP $codigo"
            [ "$codigo" = "200" ] && exit 0
            sleep 20
          done
          echo "O site não respondeu"
          exit 1
